<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063b2d">
  <meta name="application-name" content="시퀀스팡2">
  <meta name="description" content="숫자를 이어 별을 모으는 수열 퍼즐, 시퀀스팡2.">
  <title>시퀀스팡2 · SEQUENCEPANG 2</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Bagel+Fat+One&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <div class="garden" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><span>✦</span><span>✦</span></div>
    <section id="home" class="home-screen" aria-label="시퀀스팡2 메인화면">
      <div class="home-tools"><button id="home-settings" class="icon" aria-label="설정">⚙</button></div>
      <div class="home-content">
        <h1 class="brand brand-home"><img src="./sequencepang2-logo.png" alt="시퀀스팡2" width="1536" height="1152" fetchpriority="high"></h1>
        <p class="home-tagline">숫자를 이어, 별을 모아요!</p>
        <div class="home-progress"><span class="gold" aria-hidden="true">★</span><span>모은 스테이지</span><strong id="home-cleared">0</strong><span id="home-total">/ 50</span></div>
        <div class="home-actions">
          <button id="start-game" class="start-button">시작하기 <span aria-hidden="true">▶</span></button>
          <p id="resume-note" class="resume-note"></p>
          <button id="home-help" class="text-button"><span aria-hidden="true">?</span> 플레이 방법</button>
        </div>
      </div>
      <footer class="home-footer"><a href="mailto:crequations@gmail.com" aria-label="문의하기: crequations@gmail.com"><span aria-hidden="true">✉</span> 문의하기 <span class="contact-email">crequations@gmail.com</span></a></footer>
    </section>
    <section id="game" class="game" aria-label="퍼즐 플레이" hidden>
      <header class="game-header">
        <button id="game-home" class="icon" aria-label="메인화면으로">←</button>
        <div class="brand brand-game"><img src="./sequencepang2-logo.png" alt="시퀀스팡2" width="1536" height="1152"></div>
        <button id="game-settings" class="icon" aria-label="설정">⚙</button>
      </header>
      <section class="game-status" aria-label="게임 현황">
        <h2 class="stage-badge"><span>STAGE</span><strong id="stage-no">01</strong></h2>
        <div class="stat"><span>남은 이동</span><strong id="moves">2</strong></div>
        <div class="stat star-stat"><span>모은 별</span><strong><b class="gold" aria-hidden="true">★</b> <span id="star-count">0 / 4</span></strong></div>
      </section>
      <p id="lesson" class="lesson" hidden></p>
      <div class="board-frame"><div class="board-shell">
        <div id="board" class="board" aria-label="수열 퍼즐판"></div>
        <svg id="lines" aria-hidden="true"><polyline/></svg>
      </div></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite">별을 모두 모아 보세요</div>
      <button id="submit" class="primary" hidden>선택 완료</button>
      <button id="game-help" class="text-button game-help"><span aria-hidden="true">?</span> 플레이 방법</button>
    </section>
  </main>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div><button id="close-modal" class="secondary">닫기</button></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
